services:
  - type: web
    name: hoshivo
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run setup:providers
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
